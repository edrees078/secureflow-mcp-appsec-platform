name: SecureFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose Configuration
        run: pnpm run db:validate

      - name: Compile TypeScript Project References
        run: pnpm run build

      - name: Strict TypeScript Typecheck
        run: pnpm run typecheck

      - name: ESLint Code Quality & Boundary Rules
        run: pnpm run lint

      - name: Architectural Boundary Verification
        run: pnpm run test:boundaries

      - name: Validate Prisma ORM 7 Schema
        run: pnpm run prisma:validate
        env:
          DATABASE_URL: postgresql://ci_dummy_user:ci_dummy_pass@127.0.0.1:5432/ci_dummy_db?schema=public

      - name: Run Express API Integration Tests
        run: pnpm run test:api
